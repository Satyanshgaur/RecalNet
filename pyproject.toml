[project]
name = "graphmem"
version = "0.1.0"
description = "A graph-based memory system."
readme = "README.md"
authors = [
    { name = "Satyanshgaur", email = "satyanshgaur0@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "networkx>=3.4.2",
    "pydantic-settings>=2.14.1",
    "rapidfuzz>=3.14.5",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = false
